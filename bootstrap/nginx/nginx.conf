user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    default_type text/plain;
    server_tokens off;
    # Do not include request URI, query strings, cookies or authorization headers.
    log_format bootstrap '$remote_addr $request_method $status $body_bytes_sent';
    access_log /dev/stdout bootstrap;
    server {
        listen 80 default_server;
        server_name _;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        return 503 "Service temporarily unavailable.\n";
    }
    server {
        listen 80;
        server_name sokoladas.eu www.sokoladas.eu;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location ^~ /.well-known/acme-challenge/ {
            auth_basic off;
            root /var/www/acme;
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Retry-After "3600" always;
            return 503 "Service temporarily unavailable.\n";
        }
    }
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        access_log off;
        location = /health/ready { return 200 "ok\n"; }
        location / { return 404; }
    }
}
