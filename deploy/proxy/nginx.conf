user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    default_type text/plain;
    server_tokens off;
    # Do not include request URI, query strings, cookies or authorization headers.
    log_format sokoladas '$remote_addr $request_method $status $body_bytes_sent $server_name';
    access_log /dev/stdout sokoladas;

    # Shared across HTTPS servers. No HSTS; HTTP/2 on by default in this Nginx.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker DNS for resolver-backed upstreams (requires open-source Nginx 1.27.3+).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- HTTP: unmatched hosts stay on maintenance 503. ----
    server {
        listen 80 default_server;
        server_name _;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        return 503 "Service temporarily unavailable.\n";
    }

    # ---- HTTP: ACME challenge + permanent redirect to the HTTPS apex. ----
    server {
        listen 80;
        server_name sokoladas.eu www.sokoladas.eu;
        location ^~ /.well-known/acme-challenge/ {
            auth_basic off;
            root /var/www/acme;
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-store" always;
            return 308 https://sokoladas.eu$request_uri;
        }
    }

    # ---- HTTPS apex: application behind the invited-access gate. ----
    server {
        listen 443 ssl;
        server_name sokoladas.eu;
        ssl_certificate     /etc/letsencrypt/live/sokoladas.eu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sokoladas.eu/privkey.pem;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Invited-access gate (accepted Section 5 model). Enable only once the
        # application is exposed; the htpasswd file is mounted via the
        # staging_access secret.
        # auth_basic "sokoladas staging";
        # auth_basic_user_file /run/secrets/staging_access;

        # NestJS owns /api and /api/*; the prefix is preserved to the API.
        location /api {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Everything else renders through the frontend.
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ---- HTTPS www: permanent redirect to the canonical apex. ----
    server {
        listen 443 ssl;
        server_name www.sokoladas.eu;
        ssl_certificate     /etc/letsencrypt/live/sokoladas.eu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sokoladas.eu/privkey.pem;
        location / {
            add_header Cache-Control "no-store" always;
            return 308 https://sokoladas.eu$request_uri;
        }
    }

    # ---- HTTPS unmatched host: drop the connection. ----
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/sokoladas.eu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sokoladas.eu/privkey.pem;
        return 444;
    }

    # ---- Private loopback readiness; never published. ----
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        access_log off;
        location = /health/ready { return 200 "ok\n"; }
        location / { return 404; }
    }

    # ---- Resolver-backed upstreams; fixed service names, no hard-coded IPs. ----
    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
    }
    upstream api_upstream {
        zone api_upstream 64k;
        server api:3001 resolve;
    }
}
