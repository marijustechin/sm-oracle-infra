# Section 7 staging deployment model (D-002).
#
# Consistent with the Human-accepted Section 5 architecture and the reconciled
# Section 7 contract. Application image references are supplied externally via
# images.env (WEB_IMAGE / API_IMAGE) as immutable `@sha256:` digests; deploy.sh
# refuses mutable tags. All other images are pinned by digest here. PostgreSQL
# 18 compatibility with Prisma was verified (D-001), so its digest is pinned.
#
# Runtime/env/secret wiring follows the contract's reconciled interface
# (application deployment contract, "Reconciled application runtime interface"):
# the application assembles DATABASE_URL from DB_HOST/DB_PORT/DB_NAME/DB_USER
# plus a file-backed DB_PASSWORD_FILE, and reads JWT_ACCESS_SECRET_FILE.
name: sokoladas-staging

services:
  proxy:
    image: nginx:1.30.4-alpine@sha256:aed159a7f218b47bbdc020b9c74dfcfb6825a67b00d3b2c14c34cd38025fe098
    platform: linux/arm64
    entrypoint: ['/usr/local/bin/run-proxy']
    restart: unless-stopped
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    networks: [edge, app]
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./proxy/run-proxy
        target: /usr/local/bin/run-proxy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./proxy/check-certificate
        target: /usr/local/bin/check-certificate
        read_only: true
        bind:
          create_host_path: false
      - letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/acme:ro
    secrets:
      - staging_access
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/health/ready | grep -qx ok']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: ${WEB_IMAGE}
    platform: linux/arm64
    user: '10001:10001'
    init: true
    restart: unless-stopped
    networks: [app]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      # NEXT_PUBLIC_* values are inlined at image build time, not read at
      # runtime. Production uses same-origin relative /api.
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  api:
    image: ${API_IMAGE}
    platform: linux/arm64
    user: '10001:10001'
    init: true
    restart: unless-stopped
    # `egress` is the only non-internal network for the API and exists solely to
    # allow approved outbound integrations (currently SMTP). It publishes no
    # ports and only `api` is attached. `app` and `db` stay internal.
    networks: [app, db, egress]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3001'
      WEB_ORIGIN: https://sokoladas.eu
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: sokoladas_staging
      DB_USER: sokoladas_app
      # The application assembles DATABASE_URL from the components above plus
      # the password file (never rendered into a nonsecret env value).
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      # Transactional email (all-or-none application group). Nonsecret values
      # come from smtp.env (outside Git); the password is a file secret below.
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in smtp.env}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in smtp.env}
      SMTP_SECURE: ${SMTP_SECURE:?set SMTP_SECURE in smtp.env}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in smtp.env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in smtp.env}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      # Optional backend Turnstile secret (host-only). When present the API
      # enforces the challenge; the public site key is baked into the web image
      # at build time. The secret value is never rendered into an env variable.
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
      # Google OAuth (all-or-none application group). Nonsecret values come from
      # google.env (outside Git); the client secret is a file secret below. When
      # the whole group is absent the API reports google:false (disabled).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in google.env}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?set GOOGLE_CALLBACK_URL in google.env}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
    secrets:
      - db_app_password
      - jwt_access_secret
      - smtp_password
      - turnstile_secret_key
      - google_client_secret
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:3001/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  db:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    platform: linux/arm64
    restart: unless-stopped
    networks: [db]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_DB: sokoladas_staging
    secrets:
      - db_admin_password
      - db_init_app_password
      - db_init_migration_password
    volumes:
      - pg_data:/var/lib/postgresql
      - type: bind
        source: ./db/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d sokoladas_staging']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  migrate:
    image: ${API_IMAGE}
    platform: linux/arm64
    user: '10001:10001'
    restart: 'no'
    profiles: [tools]
    networks: [db]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: sokoladas_staging
      # Migration uses the separate schema-owner role, never the runtime role.
      DB_USER: sokoladas_migration
      DB_PASSWORD_FILE: /run/secrets/db_migration_password
    command: ['prisma', 'migrate', 'deploy']
    secrets:
      - db_migration_password

  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    platform: linux/arm64
    entrypoint: ['/opt/certbot/run-renewal']
    restart: unless-stopped
    networks: [edge]
    volumes:
      - type: bind
        source: ./certbot/run-renewal
        target: /opt/certbot/run-renewal
        read_only: true
        bind:
          create_host_path: false
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/acme
    tmpfs:
      - /var/lib/letsencrypt:rw,size=64m,noexec
      - /var/log/letsencrypt:rw,size=64m,noexec

networks:
  edge:
    driver: bridge
    enable_ipv6: false
  app:
    driver: bridge
    internal: true
    enable_ipv6: false
  db:
    driver: bridge
    internal: true
    enable_ipv6: false
  # Approved outbound-only path for the API (SMTP). Not internal so Docker's
  # NAT gives outbound Internet access; no ports are published and only `api`
  # joins it. Inbound isolation is unchanged (`app`/`db` remain internal).
  egress:
    driver: bridge
    enable_ipv6: false

volumes:
  pg_data:
    name: sokoladas-staging_pg_data
  letsencrypt:
    name: sokoladas-staging_letsencrypt
  acme_webroot:
    name: sokoladas-staging_acme_webroot

secrets:
  # File-backed Compose secrets retain bind-mount ownership, so the host-side
  # secret files under /etc/sokoladas-staging/secrets/ must be created with the
  # ownership described in docs/deployment.md (app UID 10001, postgres UID, or
  # Nginx worker UID) rather than relying on uid/gid/mode overrides here.
  db_admin_password:
    file: /etc/sokoladas-staging/secrets/db_admin_password
  db_app_password:
    file: /etc/sokoladas-staging/secrets/db_app_password
  db_migration_password:
    file: /etc/sokoladas-staging/secrets/db_migration_password
  db_init_app_password:
    file: /etc/sokoladas-staging/secrets/db_init_app_password
  db_init_migration_password:
    file: /etc/sokoladas-staging/secrets/db_init_migration_password
  jwt_access_secret:
    file: /etc/sokoladas-staging/secrets/jwt_access_secret
  smtp_password:
    file: /etc/sokoladas-staging/secrets/smtp_password
  turnstile_secret_key:
    file: /etc/sokoladas-staging/secrets/turnstile_secret_key
  google_client_secret:
    file: /etc/sokoladas-staging/secrets/google_client_secret
  staging_access:
    file: /etc/sokoladas-staging/secrets/staging_access
